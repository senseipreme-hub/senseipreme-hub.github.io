<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#14161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IRONLOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161A; --surface:#1D2026; --surface-2:#262A32; --surface-3:#2E333C;
  --line:#333842; --line-soft:#282C34;
  --text:#ECEEF1; --muted:#8A929E; --muted-2:#616a76;
  --brass:#E8B23A; --brass-dim:#8a6d28;
  --up:#5FD08A; --down:#E0674A; --hold:#8A929E;
  --shadow:0 8px 24px rgba(0,0,0,.4);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
.num,.disp{font-family:'Barlow Condensed','Inter',sans-serif;font-variant-numeric:tabular-nums;}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:600;margin:0;letter-spacing:.3px;}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;font-size:15px;}
input,textarea{font-family:inherit;font-size:16px;color:var(--text);}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:76px;}
.hidden{display:none!important;}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,rgba(20,22,26,0));
  padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:baseline;gap:8px;}
.brand .mark{font-family:'Barlow Condensed';font-weight:700;font-size:26px;letter-spacing:2px;}
.brand .mark b{color:var(--brass);}
.brand .sub{font-size:11px;color:var(--muted-2);letter-spacing:2.5px;text-transform:uppercase;}
.preview-flag{font-size:10.5px;color:var(--down);border:1px solid var(--down);border-radius:20px;padding:3px 9px;letter-spacing:.5px;}

.view{padding:4px 16px 20px;}

/* today hero */
.today-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow);}
.today-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brass);}
.eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.today-day{font-family:'Barlow Condensed';font-weight:700;font-size:42px;line-height:1;margin:2px 0 2px;}
.today-focus{color:var(--brass);font-family:'Barlow Condensed';font-weight:600;font-size:18px;letter-spacing:.5px;}
.today-meta{color:var(--muted);font-size:13px;margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;}
.today-meta b{color:var(--text);font-weight:600;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--brass);color:#1a1408;font-weight:700;font-size:16px;letter-spacing:.5px;
  padding:16px;border-radius:12px;margin-top:16px;font-family:'Barlow Condensed';text-transform:uppercase;}
.btn:active{transform:scale(.985);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn.sec{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
.btn.sm{padding:11px;font-size:14px;margin-top:0;}

.section-h{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 10px;}
.section-h h2{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;}

/* week strip */
.week{display:flex;gap:6px;margin-top:14px;}
.wd{flex:1;background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;
  padding:9px 4px;text-align:center;}
.wd.rest{opacity:.5;}
.wd.on{border-color:var(--brass);background:var(--surface-2);}
.wd .d{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.wd .s{font-family:'Barlow Condensed';font-weight:600;font-size:13px;margin-top:3px;color:var(--text);}
.wd.rest .s{color:var(--muted-2);}

/* exercise list preview */
.ex-row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:12px;margin-bottom:8px;}
.ex-row .ix{font-family:'Barlow Condensed';font-weight:700;color:var(--brass-dim);font-size:15px;width:20px;text-align:center;}
.ex-row .nm{flex:1;font-weight:600;font-size:14.5px;}
.ex-row .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:1px;}
.ex-row .pr{font-family:'Barlow Condensed';font-weight:700;font-size:19px;text-align:right;white-space:nowrap;}
.ex-row .pr span{font-size:12px;color:var(--muted);font-weight:500;}
.cardio-row{border-color:var(--brass-dim);}
.cardio-row .ix{color:var(--brass);}

/* ===== Guided session ===== */
#session{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;}
.sess-top{padding:calc(env(safe-area-inset-top) + 12px) 18px 8px;display:flex;align-items:center;justify-content:space-between;}
.sess-top .x{font-size:22px;color:var(--muted);width:40px;text-align:left;}
.sess-top .ttl{font-family:'Barlow Condensed';font-weight:700;font-size:18px;letter-spacing:1px;text-align:center;flex:1;}
.progress-track{height:4px;background:var(--surface-2);border-radius:4px;margin:6px 18px 0;overflow:hidden;}
.progress-fill{height:100%;background:var(--brass);width:0;transition:width .4s ease;}
.sess-body{flex:1;overflow-y:auto;padding:10px 18px 20px;display:flex;flex-direction:column;}
.step-kind{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:6px;}
.step-kind.work{color:var(--brass);}
.step-ex{font-family:'Barlow Condensed';font-weight:700;font-size:26px;text-align:center;margin:2px 0 2px;letter-spacing:.5px;}
.step-count{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px;}

.target{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;box-shadow:var(--shadow);}
.target .big{font-family:'Barlow Condensed';font-weight:700;font-size:64px;line-height:.95;letter-spacing:1px;}
.target .big .u{font-size:26px;color:var(--muted);font-weight:600;margin-left:4px;}
.target .x{font-size:30px;color:var(--muted-2);margin:0 8px;}
.target .reps{font-family:'Barlow Condensed';font-weight:700;font-size:64px;line-height:.95;}
.target .lbl{color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:8px;}

.plates{display:flex;align-items:center;justify-content:center;gap:2px;margin:16px 0 2px;min-height:52px;}
.bar-collar{width:14px;height:8px;background:#5a6270;border-radius:2px;}
.bar-line{height:4px;width:22px;background:#454c58;}
.plate{border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed';font-weight:700;font-size:11px;color:#dfe3e8;
  background:linear-gradient(180deg,#3a4150,#2a303b);border:1px solid #4a5162;}
.plate-note{text-align:center;color:var(--muted);font-size:12px;margin-top:2px;}

/* rest timer */
.rest-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.ring{position:relative;width:230px;height:230px;}
.ring svg{transform:rotate(-90deg);}
.ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .time .t{font-family:'Barlow Condensed';font-weight:700;font-size:58px;letter-spacing:1px;line-height:1;}
.ring .time .l{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:4px;}
.rest-adj{display:flex;gap:10px;margin-top:6px;}
.rest-adj button{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 16px;
  font-family:'Barlow Condensed';font-weight:600;font-size:15px;color:var(--muted);}
.next-up{color:var(--muted);font-size:13px;text-align:center;margin-top:12px;}
.next-up b{color:var(--text);}

/* log work set */
.logrow{display:flex;gap:10px;margin-top:16px;}
.field{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.field label{display:block;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.field .inp{display:flex;align-items:center;gap:8px;}
.field input{width:100%;background:transparent;border:none;outline:none;font-family:'Barlow Condensed';
  font-weight:700;font-size:30px;padding:0;}
.stepper{display:flex;flex-direction:column;gap:3px;}
.stepper button{width:30px;height:22px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;
  color:var(--muted);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;}

.feel-q{text-align:center;color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin:20px 0 8px;}
.feels{display:flex;gap:8px;}
.feel{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 6px;text-align:center;}
.feel .fi{font-size:20px;}
.feel .fn{font-family:'Barlow Condensed';font-weight:600;font-size:14px;margin-top:3px;letter-spacing:.5px;}
.feel .fd{font-size:10.5px;color:var(--muted-2);margin-top:1px;}
.feel.sel{border-color:var(--brass);background:var(--surface-2);}
.feel.sel.easy{border-color:var(--up);} .feel.sel.grind{border-color:var(--down);}

.notes-toggle{margin:16px auto 0;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;justify-content:center;}
.notes-box{margin-top:10px;}
.notes-box textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px;min-height:70px;resize:vertical;outline:none;line-height:1.4;}

.sess-foot{padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line-soft);background:var(--bg);}

/* cardio step */
.cardio-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);}
.cardio-metrics{display:flex;gap:10px;margin-bottom:8px;}
.cmet{flex:1;text-align:center;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:14px 4px;}
.cmet .v{font-family:'Barlow Condensed';font-weight:700;font-size:30px;line-height:1;}
.cmet .v .u{font-size:14px;color:var(--muted);}
.cmet .l{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:5px;}

/* summary */
.summary .done-mark{text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:30px;color:var(--brass);letter-spacing:1px;margin:8px 0 4px;}
.pr-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(232,178,58,.14);border:1px solid var(--brass-dim);
  color:var(--brass);font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;margin-left:6px;}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line-soft);}
.sum-row .snm{font-weight:600;font-size:14px;}
.sum-row .snm small{color:var(--muted);font-weight:400;display:block;font-size:12px;}
.sum-row .se{font-family:'Barlow Condensed';font-weight:700;font-size:20px;text-align:right;}
.sum-row .se span{font-size:11px;color:var(--muted);}

/* progress / lifts */
.lift-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:14px;margin-bottom:10px;}
.lift-head{display:flex;align-items:center;justify-content:space-between;}
.lift-head .ln{font-weight:600;font-size:15px;}
.lift-head .le{font-family:'Barlow Condensed';font-weight:700;font-size:22px;}
.lift-head .le small{font-size:11px;color:var(--muted);font-weight:500;}
.trend{font-size:12px;font-weight:600;}
.trend.up{color:var(--up);} .trend.down{color:var(--down);} .trend.hold{color:var(--hold);}
.spark{margin-top:10px;width:100%;height:64px;}
.lift-sub{display:flex;gap:14px;margin-top:8px;color:var(--muted);font-size:12px;}
.lift-sub b{color:var(--text);}

/* body view */
.stat-grid{display:flex;gap:10px;}
.stat{flex:1;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:14px;text-align:center;}
.stat .v{font-family:'Barlow Condensed';font-weight:700;font-size:30px;line-height:1;}
.stat .v .u{font-size:13px;color:var(--muted);}
.stat .l{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:5px;}
.retention{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px;}
.retention .rt{font-family:'Barlow Condensed';font-weight:700;font-size:19px;margin-bottom:4px;}
.retention p{color:var(--muted);font-size:13px;margin:0;line-height:1.5;}
.log-inline{display:flex;gap:8px;margin-top:12px;}
.log-inline input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;outline:none;}

/* data view */
.data-btn{margin-bottom:10px;}
.fineprint{color:var(--muted-2);font-size:12px;line-height:1.5;margin-top:14px;}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:30;
  background:rgba(21,23,28,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted-2);}
.nav button.on{color:var(--brass);}
.nav .ni{font-size:19px;line-height:1;}
.nav .nl{font-size:10px;letter-spacing:.5px;font-weight:600;}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--surface-3);
  border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:24px;font-size:14px;
  z-index:60;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;line-height:1.6;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="mark">IRON<b>LOG</b></span></div>
    <span id="previewFlag" class="preview-flag hidden">PREVIEW · download to save</span>
  </div>
  <div id="view" class="view"></div>
</div>

<div id="session" class="hidden"></div>

<div class="nav" id="nav">
  <button data-tab="today" class="on"><span class="ni">▦</span><span class="nl">Today</span></button>
  <button data-tab="progress"><span class="ni">◲</span><span class="nl">Progress</span></button>
  <button data-tab="body"><span class="ni">◍</span><span class="nl">Body</span></button>
  <button data-tab="data"><span class="ni">≡</span><span class="nl">Data</span></button>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";
/* ============================================================
   IRONLOG — single-file strength tracker
   ============================================================ */

/* ---------- storage (defensive: survives sandbox with no localStorage) ---------- */
var MEM = {}; var STORAGE_OK = true;
try { var _t="__il"; localStorage.setItem(_t,"1"); localStorage.removeItem(_t); }
catch(e){ STORAGE_OK=false; }
function store(k,v){ try{ if(STORAGE_OK){localStorage.setItem(k,JSON.stringify(v));return;} }catch(e){} MEM[k]=JSON.stringify(v); }
function load(k){ try{ if(STORAGE_OK){var r=localStorage.getItem(k);return r?JSON.parse(r):null;} }catch(e){} return MEM[k]?JSON.parse(MEM[k]):null; }

/* ---------- program seed (EXACT — no ranges) ---------- */
/* equip: bb=barbell, db=dumbbell, mc=machine/cable stack, cb=cable
   jump big/small applied on easy/just-right; grind=hold */
function E(o){ o.equip=o.equip||"mc"; o.warm=o.warm||[]; o.rest=o.rest||120; return o; }

var PROGRAM = {
  "Upper A":{ focus:"Push · Pull · Arms",
    cardio:{mode:"Incline walk", incline:9, speed:3.0, min:25},
    ex:[
      E({id:"ua_bench",name:"DB Bench Press",equip:"db",weight:55,reps:8,sets:4,rest:180,warm:[[25,8],[40,5]],big:5,small:1,repCap:11}),
      E({id:"ua_row",name:"Barbell Row",equip:"bb",weight:135,reps:10,sets:4,rest:180,warm:[[45,8],[95,5],[115,3]],big:10,small:5}),
      E({id:"ua_ohp",name:"Seated DB Overhead Press",equip:"db",weight:40,reps:8,sets:3,rest:150,warm:[[20,8],[30,5]],big:5,small:1,repCap:11}),
      E({id:"ua_pd",name:"Lat Pulldown",equip:"mc",weight:135,reps:10,sets:3,rest:120,warm:[[90,5],[115,3]],big:10,small:5}),
      E({id:"ua_curl",name:"Incline DB Curl",equip:"db",weight:30,reps:10,sets:2,rest:90,warm:[[15,10]],big:5,small:1,repCap:13}),
      E({id:"ua_push",name:"Rope Pushdown",equip:"cb",weight:42.5,reps:12,sets:2,rest:75,warm:[[25,10]],big:5,small:2.5,repCap:15})
    ]},
  "Lower A":{ focus:"Squat · Hamstrings · Calves",
    cardio:{mode:"Easy walk (legs cooked)", incline:5, speed:3.0, min:15},
    ex:[
      E({id:"la_sq",name:"Back Squat",equip:"bb",weight:175,reps:6,sets:4,rest:180,warm:[[45,8],[95,5],[135,3],[155,2]],big:20,small:10}),
      E({id:"la_rdl",name:"Romanian Deadlift",equip:"bb",weight:135,reps:10,sets:3,rest:150,warm:[[95,5],[115,3]],big:10,small:5}),
      E({id:"la_lp",name:"Leg Press",equip:"mc",perSide:true,weight:115,reps:10,sets:3,rest:120,warm:[[45,8],[90,5]],big:10,small:5}),
      E({id:"la_lc",name:"Leg Curl",equip:"mc",weight:105,reps:12,sets:3,rest:90,warm:[[70,8]],big:10,small:5}),
      E({id:"la_calf",name:"Seated Calf Raise",equip:"mc",weight:70,reps:15,sets:3,rest:90,warm:[[45,10]],big:10,small:5}),
      E({id:"la_ab",name:"Cable Crunch",equip:"cb",weight:62.5,reps:15,sets:3,rest:75,warm:[[35,10]],big:5,small:2.5})
    ]},
  "Upper B":{ focus:"Incline · Back · Shoulders",
    cardio:{mode:"Incline walk", incline:9, speed:3.0, min:25},
    ex:[
      E({id:"ub_inc",name:"Incline Barbell Press",equip:"bb",weight:155,reps:8,sets:4,rest:180,warm:[[45,8],[95,5],[135,3]],big:10,small:5}),
      E({id:"ub_row",name:"Seated Cable Row",equip:"mc",weight:150,reps:10,sets:4,rest:120,warm:[[90,8],[120,5]],big:10,small:5}),
      E({id:"ub_sp",name:"DB Shoulder Press",equip:"db",weight:40,reps:8,sets:3,rest:150,warm:[[20,8],[30,5]],big:5,small:1,repCap:11}),
      E({id:"ub_pd",name:"Lat Pulldown (wide)",equip:"mc",weight:135,reps:10,sets:3,rest:120,warm:[[90,5],[115,3]],big:10,small:5}),
      E({id:"ub_lat",name:"Lateral Raise",equip:"db",weight:20,reps:15,sets:3,rest:60,warm:[[10,12]],big:5,small:1,repCap:18}),
      E({id:"ub_arm",name:"EZ Curl + Triceps Ext (superset)",equip:"bb",weight:40,reps:12,sets:2,rest:90,warm:[],big:5,small:2.5,calibrate:true})
    ]},
  "Lower B":{ focus:"Deadlift · Quads · Calves",
    cardio:{mode:"Incline walk", incline:10, speed:2.8, min:20},
    ex:[
      E({id:"lb_dl",name:"Deadlift",equip:"bb",weight:225,reps:5,sets:4,rest:180,warm:[[135,5],[185,3],[205,2]],big:20,small:10}),
      E({id:"lb_gob",name:"Goblet / DB Squat",equip:"db",weight:60,reps:8,sets:3,rest:120,warm:[[40,8]],big:5,small:1,repCap:11}),
      E({id:"lb_lunge",name:"Walking Lunge",equip:"db",perLeg:true,weight:25,reps:10,sets:3,rest:90,warm:[[0,10]],big:5,small:1,repCap:13}),
      E({id:"lb_le",name:"Leg Extension",equip:"mc",weight:90,reps:12,sets:3,rest:90,warm:[[45,10]],big:10,small:5,calibrate:true}),
      E({id:"lb_calf",name:"Seated Calf Raise",equip:"mc",weight:90,reps:15,sets:3,rest:90,warm:[[45,10]],big:10,small:5})
    ]},
  "Cardio Day":{ focus:"Long steady state",
    cardioOnly:true,
    cardio:{mode:"Incline walk / ruck / hike", incline:6, speed:3.2, min:60}, ex:[]}
};

var SCHEDULE = { /* 0=Sun .. 6=Sat */

function isoDaysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);}

var state = load("ironlog") || null;
if(!state){ state = JSON.parse(JSON.stringify(DEFAULT_STATE)); state.prescriptions = seedPrescriptions(); save(); }
if(!state.prescriptions) { state.prescriptions = seedPrescriptions(); save(); }

function seedPrescriptions(){
  var p={};
  DAY_ORDER.forEach(function(dn){
    (PROGRAM[dn].ex||[]).forEach(function(e){
      p[e.id]={ weight:e.weight, reps:e.reps, sets:e.sets };
    });
  });
  return p;
}
function save(){ store("ironlog", state); }

/* ---------- helpers ---------- */
function e1rm(w,r){ return w*(1+r/30); }
function round(n){ return Math.round(n*10)/10; }
function fmtW(w,ex){ // dumbbell suffix
  var s = (w%1===0)? w : round(w);
  return ex && ex.equip==="db" ? s+"s" : ""+s;
}
function unitFor(ex){ return ex&&ex.perSide?"/side":(ex&&ex.perLeg?"/leg":""); }

/* plate math for barbell lifts. returns array of per-side plate weights or null */
function plateBreak(total){
  var bar=45; if(total<=bar) return {perSide:[],rem:total};
  var per=(total-bar)/2, plates=[45,35,25,10,5,2.5], out=[];
  plates.forEach(function(p){ while(per>=p-0.001){out.push(p);per=round(per-p);} });
  return {perSide:out, rem:round(per)};
}

/* next prescription after a session, per exercise, using worst feel across work sets */
function progress(ex, workSets){
  var cur = state.prescriptions[ex.id] || {weight:ex.weight,reps:ex.reps,sets:ex.sets};
  var feels = workSets.map(function(s){return s.feel;});
  var next = {weight:cur.weight, reps:cur.reps, sets:cur.sets};
  var worst = feels.indexOf("grind")>=0 ? "grind" : (feels.every(function(f){return f==="easy";})? "easy":"good");
  if(worst==="grind"){ /* hold */ }
  else if(ex.equip==="db"){
    if(worst==="easy"){ next.weight = cur.weight + ex.big; next.reps = ex.reps; }
    else { // good -> +1 rep until cap, then bump weight & reset
      if(cur.reps >= (ex.repCap||ex.reps+3)){ next.weight = cur.weight + ex.big; next.reps = ex.reps; }
      else next.reps = cur.reps + 1;
    }
  } else {
    next.weight = cur.weight + (worst==="easy"? ex.big : ex.small);
  }
  return {next:next, verdict:worst};
}

function exById(id){
  var found=null;
  DAY_ORDER.forEach(function(dn){(PROGRAM[dn].ex||[]).forEach(function(e){if(e.id===id)found=e;});});
  return found;
}
function bestE1rmFor(id){
  var m=0;
  state.sessions.forEach(function(s){ s.ex.forEach(function(x){ if(x.id===id && x.e1rm>m) m=x.e1rm; }); });
  return m;
}
function historyFor(id){
  var h=[];
  state.sessions.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(s){
    s.ex.forEach(function(x){ if(x.id===id && x.e1rm) h.push({date:s.date,e1rm:x.e1rm,w:x.best.w,r:x.best.r}); });
  });
  return h;
}

function bindPicker(){ Array.prototype.forEach.call(document.querySelectorAll(".pick"),function(el){ el.onclick=function(){ startSession(el.dataset.day); }; }); }

function shortFocus(d){ return d; }
function abbrevDay(d){ return d==="Cardio Day"?"Cardio":d.replace("Upper","Up").replace("Lower","Lo"); }
function weekdayName(i){ return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][i]; }
function fmtRest(sec){ var m=Math.floor(sec/60),s=sec%60; return m>0?(s?m+":"+(s<10?"0"+s:s):m+":00"):s+"s"; }
function estMinutes(day){ var t=0; day.ex.forEach(function(e){ t += e.sets*(e.rest/60+0.7)+e.warm.length*0.9; }); return Math.round(t+ (day.cardio?day.cardio.min:0)); }

/* ============================================================
   GUIDED SESSION ENGINE
   ============================================================ */
var SESS=document.getElementById("session");
var sess=null; // {day, steps:[], i:0, results:{}, cardioDone}

function startSession(dn){
  var day=PROGRAM[dn];
  var steps=[];
  (day.ex||[]).forEach(function(e){
    var pr=state.prescriptions[e.id];
    // warmups
    e.warm.forEach(function(w,wi){
      steps.push({type:"warm",ex:e,w:w[0],r:w[1],wi:wi,last:(wi===e.warm.length-1)});
      steps.push({type:"rest",ex:e,sec:(wi===e.warm.length-1?120:45),label:"Rest",nextTxt:"Work set 1"});
    });
    if(e.warm.length===0){ /* jump straight into work, small primer rest handled inline */ }
    // work sets
    for(var s=0;s<pr.sets;s++){
      steps.push({type:"work",ex:e,setIx:s,total:pr.sets,w:pr.weight,r:pr.reps});
      if(s<pr.sets-1) steps.push({type:"rest",ex:e,sec:e.rest,label:"Rest",nextTxt:"Work set "+(s+2)});
    }
    steps.push({type:"exdone",ex:e});
  });
  if(day.cardio) steps.push({type:"cardio",cardio:day.cardio});
  steps.push({type:"finish"});

  sess={ day:dn, steps:steps, i:0, results:{}, notes:{} };
  SESS.classList.remove("hidden"); document.body.style.overflow="hidden";
  renderStep();
}
function closeSession(confirmSave){
  SESS.classList.add("hidden"); document.body.style.overflow=""; stopTimer();
  sess=null; render();
}

function renderStep(){
  if(!sess) return;
  var st=sess.steps[sess.i];
  var pct=Math.round((sess.i/(sess.steps.length-1))*100);
  var head='<div class="sess-top"><button class="x" onclick="askClose()">✕</button>'
    +'<div class="ttl">'+sess.day+'</div><div style="width:40px"></div></div>'
    +'<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>';

  if(st.type==="warm") renderWarm(head,st);
  else if(st.type==="rest") renderRest(head,st);
  else if(st.type==="work") renderWork(head,st);
  else if(st.type==="exdone"){ sess.i++; renderStep(); }
  else if(st.type==="cardio") renderCardio(head,st);
  else if(st.type==="finish") renderFinish(head);
}

function askClose(){
  if(Object.keys(sess.results).length===0){ closeSession(); return; }
  if(confirm("Leave this session? Logged sets will be discarded.")) closeSession();
}

function platesHtml(plates,total){
  if(!plates) return "";

  plates.perSide.forEach(function(p){

    h+='<div class="plate" style="height:'+Math.min(ht,72)+'px;width:'+wd+'px">'+p+'</div>';
  });
  h+='<div class="bar-line"></div></div>';
  h+='<div class="plate-note">'+total+' lb · '+plates.perSide.join(" · ")+' per side</div>';
  return h;

    +'<div class="target">'

  SESS.innerHTML=head+body;
  sess._feel=null;
}
function notesBlock(e){
  var existing = (sess.notes[e.id]||"");

function toggleNotes(btn){ var box=btn.nextElementSibling; box.classList.toggle("hidden"); if(!box.classList.contains("hidden")) box.querySelector("textarea").focus(); }
function saveNote(id,v){ sess.notes[id]=v; }
function bump(id,by){ var el=document.getElementById(id); var v=parseFloat(el.value||0)+by; if(v<0)v=0; el.value=(v%1===0)?v:round(v); }
function pickFeel(btn){
  Array.prototype.forEach.call(btn.parentNode.children,function(b){b.classList.remove("sel","easy","good","grind");
    if(b.dataset.feel==="easy")b.classList.add("easy"); if(b.dataset.feel==="grind")b.classList.add("grind");});
  Array.prototype.forEach.call(btn.parentNode.children,function(b){b.classList.remove("sel");});

function logWorkSet(){

var timerH=null, timeLeft=0, timeTotal=0;
function startTimer(sec){ stopTimer(); timeLeft=sec; timeTotal=sec; paintRing();
  timerH=setInterval(function(){ timeLeft--; if(timeLeft<=0){ stopTimer(); beep(); skipRest(); return;} paintRing(); },1000);
}
function paintRing(){
  var t=document.getElementById("rtime"); if(!t)return;
  var mm=Math.floor(Math.max(timeLeft,0)/60), ss=Math.max(timeLeft,0)%60;
  t.textContent=mm+":"+(ss<10?'0'+ss:ss);
  var circ=653.45, off=circ*(1-timeLeft/timeTotal); var rp=document.getElementById("ringp");
  if(rp) rp.style.strokeDashoffset=off;
}
function stopTimer(){ if(timerH){clearInterval(timerH);timerH=null;} }
function adjRest(d){ timeLeft=Math.max(1,timeLeft+d); if(d>0)timeTotal=Math.max(timeTotal,timeLeft); paintRing(); }
function skipRest(){ stopTimer(); advance(); }
function beep(){ try{ var a=new (window.AudioContext||window.webkitAudioContext)();
  var o=a.createOscillator(),g=a.createGain(); o.connect(g);g.connect(a.destination);
  o.frequency.value=880; g.gain.setValueAtTime(0.001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.3,a.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.5); o.start();o.stop(a.currentTime+0.5);
}catch(e){} if(navigator.vibrate)navigator.vibrate(200); }

  timerH=setInterval(function(){ timeLeft--; if(timeLeft<=0){stopTimer();beep();var b=document.getElementById("cbtn");if(b)b.textContent="✓ Done";return;} paintRing(); },1000);
}

function advance(){ stopTimer(); sess.i++; if(sess.i>=sess.steps.length){ finalizeSession(); return;} renderStep(); }

function finalizeSession(){ renderStep(); }

function renderFinish(head){
  // build session record
  var rec={ id:"s"+Date.now(), day:sess.day, date:new Date().toISOString().slice(0,10), ex:[], notes:sess.notes };
  var prNames=[];
  Object.keys(sess.results).forEach(function(id){
    var r=sess.results[id]; if(!r.sets.length) return;
    var best=r.sets.reduce(function(a,b){ return e1rm(b.w,b.r)>=e1rm(a.w,a.r)?b:a; });
    var em=round(e1rm(best.w,best.r));
    var prevBest=bestE1rmFor(id);
    if(em>prevBest && prevBest>0) prNames.push(r.ex.name);
    rec.ex.push({ id:id, name:r.ex.name, equip:r.ex.equip, sets:r.sets, best:{w:best.w,r:best.r}, e1rm:em, note:sess.notes[id]||"" });
    // apply progression
    var pg=progress(r.ex, r.sets);
    state.prescriptions[id]=pg.next;
  });
  state.sessions.push(rec); save();

  var body='<div class="sess-body summary"><div class="done-mark">SESSION LOGGED</div>'
    +'<div style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px">'+sess.day+' · '+niceDate(rec.date)+'</div>';
  if(prNames.length){
    body+='<div style="text-align:center;margin-bottom:8px"><span class="pr-badge">★ '+prNames.length+' new PR'+(prNames.length>1?'s':'')+'</span></div>';
  }
  if(rec.ex.length===0){
    body+='<div class="empty">No work sets logged this time.</div>';
  }
  rec.ex.forEach(function(x){
    var e=exById(x.id);
    var np=state.prescriptions[x.id];
    var isPr=prNames.indexOf(x.name)>=0;
    body+='<div class="sum-row"><div class="snm">'+x.name+(isPr?' <span class="pr-badge">★ PR</span>':'')
      +'<small>logged '+fmtW(x.best.w,e)+' × '+x.best.r+' → next: '+fmtW(np.weight,e)+' × '+np.reps+'</small></div>'
      +'<div class="se">'+x.e1rm+'<span> e1RM</span></div></div>';
  });
  body+='<div style="flex:1"></div></div>'
    +'<div class="sess-foot"><button class="btn" onclick="closeSession()">Done</button></div>';
  SESS.innerHTML='<div class="sess-top"><div style="width:40px"></div><div class="ttl">Complete</div><div style="width:40px"></div></div>'
    +'<div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>'+body;
}
function niceDate(iso){ var d=new Date(iso+"T12:00"); return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }

/* ============================================================
   PROGRESS
   ============================================================ */
function renderProgress(){
  var html='<div class="section-h" style="margin-top:8px"><h2>Strength · e1RM</h2></div>';
  var any=state.sessions.length>0;
  if(!any){ html+='<div class="empty">Log your first session and your estimated 1-rep-max will start trending here — one line per lift, with PRs flagged.</div>'; VIEW.innerHTML=html; return; }
  var order=KEY_LIFTS.concat(Object.keys(state.prescriptions).filter(function(k){return KEY_LIFTS.indexOf(k)<0;}));
  order.forEach(function(id){
    var h=historyFor(id); if(!h.length) return;
    var e=exById(id); if(!e) return;
    var latest=h[h.length-1], first=h[0];
    var delta = latest.e1rm-first.e1rm;
    var pct = first.e1rm? Math.round((delta/first.e1rm)*100):0;
    var cls = delta>0.5?"up":(delta<-0.5?"down":"hold");
    var arrow = delta>0.5?"▲":(delta<-0.5?"▼":"■");
    html+='<div class="lift-card"><div class="lift-head">'
      +'<div class="ln">'+e.name+'</div>'
      +'<div class="le">'+latest.e1rm+' <small>e1RM</small></div></div>'
      + sparkSvg(h)
      +'<div class="lift-sub"><span class="trend '+cls+'">'+arrow+' '+(pct>=0?'+':'')+pct+'% </span>'
      +'<span>best set <b>'+fmtW(latest.w,e)+' × '+latest.r+'</b></span>'
      +'<span>PR <b>'+bestE1rmFor(id)+'</b></span></div></div>';
  });
  VIEW.innerHTML=html;
}
function sparkSvg(h){
  var W=470,H=64,pad=6;
  var vals=h.map(function(p){return p.e1rm;});
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  if(min===max){ min-=5; max+=5; }
  var n=h.length;
  function x(i){ return n<=1? W/2 : pad + i*(W-2*pad)/(n-1); }
  function y(v){ return H-pad - (v-min)/(max-min)*(H-2*pad); }
  var d="", dots="";
  h.forEach(function(p,i){ d+=(i?"L":"M")+x(i).toFixed(1)+" "+y(p.e1rm).toFixed(1)+" ";
    dots+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.e1rm).toFixed(1)+'" r="'+(i===n-1?3.5:2.2)+'" fill="'+(i===n-1?'var(--brass)':'var(--muted-2)')+'"/>'; });
  var area=d+"L "+x(n-1).toFixed(1)+" "+H+" L "+x(0).toFixed(1)+" "+H+" Z";
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
    +'<defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="rgba(232,178,58,.18)"/><stop offset="1" stop-color="rgba(232,178,58,0)"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#g1)"/>'
    +'<path d="'+d+'" fill="none" stroke="var(--brass)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    +dots+'</svg>';
}

/* ============================================================
   BODY
   ============================================================ */
function renderBody(){
  var b=state.body.slice().sort(function(a,z){return a.date<z.date?-1:1;});
  var latest=b[b.length-1], first=b[0];
  var cur=latest.weight, start=first.weight, change=round(cur-start);
  // strength index: avg of latest e1rm of key lifts vs earliest
  var idxNow=strengthIndex("latest"), idxFirst=strengthIndex("first");
  var html='<div class="section-h" style="margin-top:8px"><h2>Body · '+state.stats.height+'</h2></div>'
    +'<div class="stat-grid">'
      +'<div class="stat"><div class="v">'+cur+'<span class="u"> lb</span></div><div class="l">Current</div></div>'
      +'<div class="stat"><div class="v" style="color:'+(change<0?'var(--up)':'var(--text)')+'">'+(change>0?'+':'')+change+'<span class="u"> lb</span></div><div class="l">Change</div></div>'
      +'<div class="stat"><div class="v">'+(idxNow||'—')+'</div><div class="l">Strength idx</div></div>'
    +'</div>';

  // retention read
  var msg;
  if(idxNow && idxFirst){
    var sd=idxNow-idxFirst;
    if(change<0 && sd>=-2) msg={t:"Muscle: holding ✓", p:"Bodyweight is down "+Math.abs(change)+" lb and your strength index is "+(sd>=0?"up":"flat")+". On a deficit, that's the signal that the weight you're losing is fat, not muscle. Keep protein at 200–220g."};
    else if(change<0 && sd<-2) msg={t:"Watch your strength", p:"Weight is dropping but your strength index slipped "+Math.abs(round(sd))+". A little is normal on a cut; if it keeps falling, the deficit may be too steep or protein/sleep too low. Hold weights before chasing PRs."};
    else msg={t:"Building", p:"Strength index is up "+round(sd)+". Ride the muscle memory — this is the fastest strength will ever come back."};
  } else {
    msg={t:"Not enough data yet", p:"Log a few sessions and a bodyweight or two, and this will tell you whether you're holding muscle as the scale moves."};
  }
  html+='<div class="retention"><div class="rt">'+msg.t+'</div><p>'+msg.p+'</p></div>';

  html+='<div class="section-h"><h2>Log bodyweight</h2></div>'
    +'<div class="log-inline"><input id="bwIn" inputmode="decimal" placeholder="Weight (lb) — today"><button class="btn sm" style="width:auto;padding:12px 18px" onclick="logBW()">Save</button></div>';

  // weight history sparkline
  if(b.length>1){
    var hh=b.filter(function(x){return x.weight;}).map(function(x){return {e1rm:x.weight,date:x.date,w:x.weight,r:0};});
    html+='<div class="lift-card" style="margin-top:14px"><div class="lift-head"><div class="ln">Bodyweight trend</div>'
      +'<div class="le">'+cur+' <small>lb</small></div></div>'+sparkSvg(hh)+'</div>';
  }

  // recent entries
  html+='<div class="section-h"><h2>History</h2></div>';
  b.slice().reverse().forEach(function(x){
    html+='<div class="ex-row"><div class="nm">'+niceDate(x.date)+'<small>'+(x.note||'')+(x.steps?(' · '+x.steps+' steps'):'')+'</small></div>'
      +'<div class="pr">'+(x.weight||'—')+'<span> lb</span></div></div>';
  });
  VIEW.innerHTML=html;
}
function strengthIndex(which){
  var ids=KEY_LIFTS, sum=0, n=0;
  ids.forEach(function(id){ var h=historyFor(id); if(h.length){ sum += (which==="first"?h[0].e1rm:h[h.length-1].e1rm); n++; } });
  return n? Math.round(sum/n):0;
}
function logBW(){
  var v=parseFloat(document.getElementById("bwIn").value);
  if(!v||v<50){ toast("Enter a valid weight"); return; }
  var today=new Date().toISOString().slice(0,10);
  var existing=state.body.filter(function(x){return x.date===today;})[0];
  if(existing) existing.weight=v; else state.body.push({date:today,weight:v,steps:null,cardio:null,note:""});
  state.stats.bw=v; save(); toast("Bodyweight saved"); renderBody();
}

/* ============================================================
   DATA
   ============================================================ */
function renderData(){
  var nSess=state.sessions.length;
  var html='<div class="section-h" style="margin-top:8px"><h2>Your data</h2></div>'
    +'<div class="stat-grid" style="margin-bottom:14px">'
      +'<div class="stat"><div class="v">'+nSess+'</div><div class="l">Sessions</div></div>'
      +'<div class="stat"><div class="v">'+state.body.length+'</div><div class="l">BW logs</div></div>'
      +'<div class="stat"><div class="v">'+(STORAGE_OK?'ON':'OFF')+'</div><div class="l">Saving</div></div>'
    +'</div>'
    +'<button class="btn sec data-btn" onclick="exportData()">⭳ Export backup (JSON)</button>'
    +'<button class="btn sec data-btn" onclick="document.getElementById(\'importFile\').click()">⭱ Import backup</button>'
    +'<input type="file" id="importFile" accept="application/json" class="hidden" onchange="importData(event)">'
    +'<button class="btn ghost data-btn" style="color:var(--down);border-color:var(--brass-dim)" onclick="resetProgress()">↺ Reset all progress</button>';

  if(!STORAGE_OK){
    html+='<div class="retention" style="margin-top:14px"><div class="rt" style="color:var(--down)">Preview mode</div>'
      +'<p>This is running inside a preview that can\'t save to your device, so data resets on reload. To use it for real: <b>download this file</b> and open it in your phone or computer browser, or host it (see the note the assistant gave you). Then your logs persist automatically. Use Export any time to keep a backup.</p></div>';
  }

  html+='<div class="fineprint">Everything is stored locally on your device — nothing leaves it. e1RM uses the Epley estimate: weight × (1 + reps/30); it\'s most accurate at ~10 reps or fewer. Your progression follows straight-set linear loading: reps stay fixed, weight climbs by your tap-in, and holds on a grind. Built '+niceDate(new Date().toISOString().slice(0,10))+'.</div>';
  VIEW.innerHTML=html;
}
function exportData(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob); var a=document.createElement("a");
  a.href=url; a.download="ironlog-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},1000); toast("Backup downloaded");
}
function importData(ev){
  var f=ev.target.files[0]; if(!f)return; var rd=new FileReader();
  rd.onload=function(){ try{ var s=JSON.parse(rd.result);
    if(!s.sessions||!s.prescriptions) throw 0; state=s; save(); toast("Backup restored"); render();
  }catch(e){ toast("Couldn't read that file"); } };
  rd.readAsText(f);
}
function resetProgress(){
  if(!confirm("Reset ALL sessions, progress, and bodyweight back to your starting prescription? This can't be undone.")) return;
  state=JSON.parse(JSON.stringify(DEFAULT_STATE)); state.prescriptions=seedPrescriptions(); save(); toast("Reset to baseline"); setTab("today");
}

/* ---------- nav wiring ---------- */
Array.prototype.forEach.call(document.querySelectorAll(".nav button"),function(b){ b.onclick=function(){ setTab(b.dataset.tab); }; });

/* expose handlers used inline */
window.advance=advance; window.askClose=askClose; window.closeSession=closeSession;
window.bump=bump; window.pickFeel=pickFeel; window.logWorkSet=logWorkSet;
window.adjRest=adjRest; window.skipRest=skipRest; window.toggleCardioTimer=toggleCardioTimer;
window.toggleNotes=toggleNotes; window.saveNote=saveNote;
window.logBW=logBW; window.exportData=exportData; window.importData=importData; window.resetProgress=resetProgress;

render();
</script>
</body>
